<ion-header class="ion-no-border">
  <ion-toolbar class="profile-toolbar">
    <ion-title class="profile-title">Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="profile-content">
  <div class="rod-container">

    <!-- Tarjeta de identidad (datos de la sesion de Supabase) -->
    <section class="perfil-card">
      <div class="avatar">
        @if (sesion()?.avatarUrl) {
          <img [src]="sesion()!.avatarUrl" alt="Foto de perfil" />
        } @else {
          <span>{{ iniciales() }}</span>
        }
      </div>
      <div class="datos">
        <h2>{{ sesion()?.nombre ?? 'Carlos Rodríguez' }}</h2>
        <p>{{ sesion()?.email ?? 'carlos.rodriguez@ejemplo.com' }}</p>
      </div>
    </section>

    <!-- Opciones estilo Figma -->
    <section class="opciones">
      <button type="button" class="opcion" routerLink="/app/perfil/editar">
        <div class="opcion-left">
          <ion-icon name="create-outline" aria-hidden="true"></ion-icon>
          <span>Editar datos personales</span>
        </div>
        <ion-icon name="chevron-forward-outline" class="chev" aria-hidden="true"></ion-icon>
      </button>
      <button type="button" class="opcion" routerLink="/app/notificaciones">
        <div class="opcion-left">
          <ion-icon name="notifications-outline" aria-hidden="true"></ion-icon>
          <span>Notificaciones</span>
        </div>
        <ion-icon name="chevron-forward-outline" class="chev" aria-hidden="true"></ion-icon>
      </button>
      <button type="button" class="opcion" routerLink="/app/perfil/ajustes">
        <div class="opcion-left">
          <ion-icon name="shield-checkmark-outline" aria-hidden="true"></ion-icon>
          <span>Seguridad</span>
        </div>
        <ion-icon name="chevron-forward-outline" class="chev" aria-hidden="true"></ion-icon>
      </button>
    </section>

    <!-- Cerrar sesion -->
    <div class="logout-wrapper">
      <button
        type="button"
        class="logout-outline-btn"
        [disabled]="cerrando()"
        (click)="cerrarSesion()"
      >
        @if (cerrando()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
        }
        <span>{{ cerrando() ? 'Cerrando...' : 'Cerrar sesión' }}</span>
      </button>
    </div>
  </div>
</ion-content>
